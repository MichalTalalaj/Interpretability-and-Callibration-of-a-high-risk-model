# Selected by training CV and validation threshold selection; see docs/tuning-results.md.
random_seed: 42
data:
  path: ../zbiór_10.csv
  target: default
  encoding: utf-8-sig
  separator: ','
  features: null
  drop_columns:
  - szczegolnaFormaPrawna_Symbol
  categorical_features:
  - formaWlasnosci_Symbol
  - schemat_wsk_bilans
  - schemat_wsk_rzis
  - pkdKod
  test_size: 0.2
  validation_size: 0.2
preprocessing:
  numeric_imputation: median
  add_missing_indicators: true
  variance_threshold: 0.0
models:
  glassbox:
    C: 0.1
    class_weight: balanced
    max_iter: 1000
    penalty: l1
    solver: liblinear
    tol: 0.001
  blackbox:
    objective: binary:logistic
    eval_metric: auc
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 2
calibration:
  method: none
  sigmoid_C: 1000000.0
  max_iter: 1000
tuning:
  n_iter: 40
  cv_folds: 5
  n_jobs: 2
  threshold_beta: 2.0
evaluation:
  threshold: 0.5661036429874251
  psi_bins: 10
  psi_epsilon: 1.0e-06
  calibration_bins: 10
explainability:
  methods:
  - native
  - shap
  background_size: 100
  sample_size: 20
  lime_num_samples: 1000
  top_features: 15
output:
  directory: ../artifacts/selected
