random_seed: 42
data:
  path: ../zbiór_10.csv
  target: default
  encoding: utf-8-sig
  separator: ','
  features: null  # all columns except target and drop_columns
  drop_columns: [szczegolnaFormaPrawna_Symbol]
  categorical_features: [formaWlasnosci_Symbol, schemat_wsk_bilans, schemat_wsk_rzis, pkdKod]
  test_size: 0.20
  validation_size: 0.20  # fraction of the complete dataset
preprocessing:
  numeric_imputation: median
  add_missing_indicators: true
  variance_threshold: 0.0
models:
  glassbox:
    C: 2.0
    penalty: l2
    solver: liblinear
    max_iter: 1000
    class_weight: null
  blackbox:
    objective: binary:logistic
    eval_metric: auc
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 2
calibration:
  method: none  # none, sigmoid, isotonic; fitted on validation only
  sigmoid_C: 1000000.0
  max_iter: 1000
tuning:
  n_iter: 40
  cv_folds: 5
  n_jobs: 2
  threshold_beta: 2.0  # prioritize default recall; selected on validation only
evaluation:
  threshold: 0.5
  psi_bins: 10
  psi_epsilon: 0.000001
  calibration_bins: 10
explainability:
  methods: [native, shap]
  background_size: 100
  sample_size: 20
  lime_num_samples: 1000
  top_features: 15
output:
  directory: ../artifacts
